<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Vault with Real Storage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        /* کیلکولیٹر UI */
        .calculator-container { width: 320px; background-color: #1e1e1e; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .display { width: 100%; height: 80px; background-color: #000000; border-radius: 10px; color: #ffffff; font-size: 2.5rem; text-align: right; padding: 15px; margin-bottom: 20px; word-break: break-all; }
        .buttons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { height: 60px; border-radius: 50px; border: none; outline: none; font-size: 1.5rem; background-color: #2c2c2c; color: #ffffff; cursor: pointer; }
        button.operator { background-color: #333333; color: #2196f3; }
        button.equals { background-color: #2196f3; color: #ffffff; grid-column: span 3; border-radius: 30px; }
        button.clear { background-color: #ff5252; color: #ffffff; }

        /* خفیہ والٹ UI */
        .vault-container { display: none; width: 100%; max-width: 600px; background-color: #1e1e1e; border-radius: 20px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .vault-header { color: #4caf50; font-size: 1.8rem; margin-bottom: 15px; text-align: center; }
        .upload-section { margin: 20px 0; padding: 15px; background: #2c2c2c; border-radius: 10px; text-align: center; }
        input[type="file"] { display: none; }
        .upload-btn { background-color: #2196f3; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: inline-block; font-size: 1rem; }
        
        /* گیلری گرڈ */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .gallery-item { position: relative; width: 100%; height: 100px; border-radius: 8px; overflow: hidden; background: #000; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(255, 82, 82, 0.8); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; }

        .lock-btn { margin-top: 20px; background-color: #ff5252; padding: 10px 20px; border-radius: 8px; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- 1. کیلکولیٹر -->
    <div class="calculator-container" id="calculatorApp">
        <div class="display" id="display">0</div>
        <div class="buttons-grid">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendInput('/')">÷</button>
            <button class="operator" onclick="appendInput('*')">×</button>
            <button class="operator" onclick="appendInput('-')">-</button>

            <button onclick="appendInput('7')">7</button>
            <button onclick="appendInput('8')">8</button>
            <button onclick="appendInput('9')">9</button>
            <button class="operator" onclick="appendInput('+')">+</button>

            <button onclick="appendInput('4')">4</button>
            <button onclick="appendInput('5')">5</button>
            <button onclick="appendInput('6')">6</button>
            <button onclick="appendInput('.')">.</button>

            <button onclick="appendInput('1')">1</button>
            <button onclick="appendInput('2')">2</button>
            <button onclick="appendInput('3')">3</button>

            <button onclick="appendInput('0')">0</button>
            <button class="equals" onclick="checkVault()">=</button>
        </div>
    </div>

    <!-- 2. والٹ اسکرین (اصلی گیلری کے ساتھ) -->
    <div class="vault-container" id="vaultApp">
        <h2 class="vault-header">🔓 Secret Vault (تصاویر محفوظ کریں)</h2>
        
        <div class="upload-section">
            <label for="imageUpload" class="upload-btn">➕ تصوير منتخب کریں اور محفوظ کریں</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="saveImage(event)">
        </div>

        <h3>🖼️ آپ کی محفوظ کردہ تصاویر:</h3>
        <div class="gallery-grid" id="galleryGrid"></div>

        <button class="lock-btn" onclick="lockVault()">دوبارہ لاک کریں</button>
    </div>

    <script>
        let currentInput = "";
        const SECRET_PIN = "1234";

        function appendInput(value) {
            if (currentInput === "0" || currentInput === "Error") currentInput = "";
            currentInput += value;
            document.getElementById("display").innerText = currentInput;
        }

        function clearDisplay() {
            currentInput = "";
            document.getElementById("display").innerText = "0";
        }

        function checkVault() {
            if (currentInput === SECRET_PIN) {
                document.getElementById("calculatorApp").style.display = "none";
                document.getElementById("vaultApp").style.display = "block";
                loadImages(); // والٹ کھلتے ہی پرانی تصاویر لوڈ ہوں گی
                clearDisplay();
            } else {
                try {
                    let result = eval(currentInput);
                    document.getElementById("display").innerText = result;
                    currentInput = result.toString();
                } catch (e) {
                    document.getElementById("display").innerText = "Error";
                    currentInput = "";
                }
            }
        }

        function lockVault() {
            document.getElementById("vaultApp").style.display = "none";
            document.getElementById("calculatorApp").style.display = "block";
        }

        // --- تصاویر کو براؤزر میں اصل میں محفوظ کرنے کا کوڈ ---

        function saveImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    let storedImages = JSON.parse(localStorage.getItem('vault_images') || '[]');
                    storedImages.push(imageData);
                    localStorage.setItem('vault_images', JSON.stringify(storedImages));
                    loadImages();
                };
                reader.readAsDataURL(file);
            }
        }

        function loadImages() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';
            let storedImages = JSON.parse(localStorage.getItem('vault_images') || '[]');

            storedImages.forEach((imgSrc, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${imgSrc}">
                    <button class="delete-btn" onclick="deleteImage(${index})">✕</button>
                `;
                galleryGrid.appendChild(item);
            });
        }

        function deleteImage(index) {
            let storedImages = JSON.parse(localStorage.getItem('vault_images') || '[]');
            storedImages.splice(index, 1);
            localStorage.setItem('vault_images', JSON.stringify(storedImages));
            loadImages();
        }
    </script>
</body>
</html>
