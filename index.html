<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Vault</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* کیلکولیٹر کی باڈی */
        .calculator-container {
            width: 320px;
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* ڈسپلے اسکرین */
        .display {
            width: 100%;
            height: 80px;
            background-color: #000000;
            border-radius: 10px;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
            word-wrap: break-word;
            word-break: break-all;
        }

        /* بٹنوں کا گرڈ */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border-radius: 50px;
            border: none;
            outline: none;
            font-size: 1.5rem;
            background-color: #2c2c2c;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            opacity: 0.7;
        }

        button.operator {
            background-color: #333333;
            color: #2196f3;
        }

        button.equals {
            background-color: #2196f3;
            color: #ffffff;
            grid-column: span 3;
            border-radius: 30px;
        }

        button.clear {
            background-color: #ff5252;
            color: #ffffff;
        }

        /* سیکرٹ والٹ (خفیہ اسکرین) */
        .vault-container {
            display: none;
            width: 100%;
            max-width: 500px;
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .vault-header {
            color: #4caf50;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .vault-content {
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .lock-btn {
            margin-top: 20px;
            background-color: #ff5252;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- 1. کیلکولیٹر والی اسکرین -->
    <div class="calculator-container" id="calculatorApp">
        <div class="display" id="display">0</div>
        <div class="buttons-grid">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendInput('/')">÷</button>
            <button class="operator" onclick="appendInput('*')">×</button>
            <button class="operator" onclick="appendInput('-')">-</button>

            <button onclick="appendInput('7')">7</button>
            <button onclick="appendInput('8')">8</button>
            <button onclick="appendInput('9')">9</button>
            <button class="operator" onclick="appendInput('+')">+</button>

            <button onclick="appendInput('4')">4</button>
            <button onclick="appendInput('5')">5</button>
            <button onclick="appendInput('6')">6</button>
            <button onclick="appendInput('.')">.</button>

            <button onclick="appendInput('1')">1</button>
            <button onclick="appendInput('2')">2</button>
            <button onclick="appendInput('3')">3</button>

            <button onclick="appendInput('0')">0</button>
            <button class="equals" onclick="checkVault()">=</button>
        </div>
    </div>

    <!-- 2. چھپی ہوئی اسکرین (Secret Vault) -->
    <div class="vault-container" id="vaultApp">
        <h2 class="vault-header">🔓 Welcome to Secret Vault!</h2>
        <p>آپ کا سیکرٹ پاسورڈ درست ہے۔ یہ آپ کی خفیہ اسکرین ہے۔</p>
        
        <div class="vault-content">
            <h3>📁 آپ کی خفیہ فائلیں</h3>
            <p style="margin-top: 10px; color: #aaa;">(یہاں آپ اپنی تصاویر اور ویڈیوز محفوظ کر سکتے ہیں)</p>
        </div>

        <button class="lock-btn" onclick="lockVault()">دوبارہ لاک کریں</button>
    </div>

    <script>
        let currentInput = "";
        
        // پن اور ریسیٹ کوڈ
        const SECRET_PIN = "1234";
        const RESET_CODE = "11223344";

        function appendInput(value) {
            if (currentInput === "0" || currentInput === "Error") {
                currentInput = "";
            }
            currentInput += value;
            document.getElementById("display").innerText = currentInput;
        }

        function clearDisplay() {
            currentInput = "";
            document.getElementById("display").innerText = "0";
        }

        // '=' بٹن پر پاسورڈ یا حساب چیک کرنے کا لاجک
        function checkVault() {
            if (currentInput === SECRET_PIN) {
                // صحیح پاسورڈ پر سیکرٹ والٹ دکھائیں
                document.getElementById("calculatorApp").style.display = "none";
                document.getElementById("vaultApp").style.display = "block";
                clearDisplay();
            } else if (currentInput === RESET_CODE) {
                alert("پاسورڈ بحالی: سیکیورٹی سوال کی تصدیق کے لیے سپورٹ سے رابطہ کریں۔");
                clearDisplay();
            } else {
                // اگر پاسورڈ نہیں تو عام ریاضی کا حساب کرے گا
                try {
                    let result = eval(currentInput);
                    document.getElementById("display").innerText = result;
                    currentInput = result.toString();
                } catch (e) {
                    document.getElementById("display").innerText = "Error";
                    currentInput = "";
                }
            }
        }

        function lockVault() {
            document.getElementById("vaultApp").style.display = "none";
            document.getElementById("calculatorApp").style.display = "block";
        }
    </script>

</body>
</html>
